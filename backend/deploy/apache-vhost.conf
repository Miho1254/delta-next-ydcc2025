# Apache2 Virtual Host Configuration for Agri-Loop API
# File: /etc/apache2/sites-available/agri-loop.conf
#
# Instructions:
# 1. Copy this file to /etc/apache2/sites-available/agri-loop.conf
# 2. Replace YOUR_DOMAIN with your actual domain
# 3. Run: sudo a2ensite agri-loop.conf && sudo systemctl reload apache2
# 4. Run: sudo certbot --apache -d YOUR_DOMAIN

<VirtualHost *:80>
    ServerName YOUR_DOMAIN
    ServerAlias www.YOUR_DOMAIN
    
    # Redirect HTTP to HTTPS
    RewriteEngine on
    RewriteCond %{SERVER_NAME} =YOUR_DOMAIN [OR]
    RewriteCond %{SERVER_NAME} =www.YOUR_DOMAIN
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<VirtualHost *:443>
    ServerName YOUR_DOMAIN
    ServerAlias www.YOUR_DOMAIN
    
    # SSL will be configured by Certbot
    # SSLEngine on
    # SSLCertificateFile /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem
    # SSLCertificateKeyFile /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem
    
    # Proxy to Next.js app
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:2026/
    ProxyPassReverse / http://127.0.0.1:2026/
    
    # Headers
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Real-IP %{REMOTE_ADDR}s
    
    # Logging
    ErrorLog ${APACHE_LOG_DIR}/agri-loop-error.log
    CustomLog ${APACHE_LOG_DIR}/agri-loop-access.log combined
</VirtualHost>
